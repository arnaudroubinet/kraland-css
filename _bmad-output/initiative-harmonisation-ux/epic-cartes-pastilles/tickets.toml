# tickets.toml — epic-cartes-pastilles, dans l'ordre de construction.
# Balle traçante : entrée 1 (carte de section mobile des pages de jeu, kramail par les mêmes règles communes, suite cartes-pastilles.mjs et sa zone dans le routeur) ;
# l'entrée la moins sûre vient ensuite : la liste des sujets du forum entre dans la carte (R6), qui retire la pleine largeur figée par le ticket 6.1.
# Entrées chaînées par collision, pas par dépendance fonctionnelle : elles partagent la suite cartes-pastilles.mjs (créée par l'entrée 1)
# et réécrivent les sections mobiles des panneaux et des pastilles de kraland-theme.css (décision prise en autonomie, 2026-10-24).
# Commun : valeurs de DESIGN.md › Components (Carte de section, Pastille d'état, Étiquette de catégorie) ; DESIGN et EXPERIENCE priment sur les maquettes ;
# P1 option 4 : chaque entrée retire ou réécrit les règles qu'elle remplace, sans les battre par spécificité ou !important, et garde par page en :where(html.x) ce qu'elle conserve ;
# règle commune aux deux supports en liste combinée @media (max-width: 767px), (min-width: 768px) ; mobile en max-width: 767px seulement ;
# chaque plan consigne son rouge avant sur le bundle de sa base (classe kr-theme-enabled vérifiée), puis une contre-épreuve (mutation → rouge), et range son tri de revue sous ## Review Triage Log ;
# chaque masque de test ajouté porte sa condition de retrait ; toute règle de couleur est vérifiée dans les 16 variantes ;
# largeurs et variantes communes : 375×667, 767, 768, 769, 1280, 1440 et 1920 px, Kraland clair et Empire Brun sombre au moins ; fixtures synthétiques, existantes ou créées par l'entrée qui en a besoin ;
# chaque entrée qui touche tests/ lance aussi npm run test:router ;
# hors périmètre : focus clavier (aucune règle :focus), kramail au-delà des règles communes (thème du forum, épopée 7), lignes de l'index ≥ 72 px (épopée 6),
# onglets (CAP-8), marge latérale de 16 px et cibles hors en-têtes (épopée 9) ; aucune icône ajoutée là où le site n'en a pas (Q30.7).

[[entry]]
id = 1
type = "story"
title = "Carte de section mobile des pages de jeu ; kramail par les règles communes"
description = "Balle traçante : sur mobile, chaque panneau .panel-default des pages de jeu (Matériel, Personnage, Bâtiments, Employés, panneaux Commerce et Matériel du plateau) devient une carte de section : en-tête de 48 px et contenu dans la même carte --kr-radius-md sur bg-surface, en retrait de 8 px des bords, contenu à 16 px de marge intérieure (Q10, hypothèse), titre 17 px gras en text-primary, icône native à gauche ; chevron du module « Panel Sections Collapse » sur Bâtiment, Commerce et Matériel, chevron natif ailleurs s'il existe, aucun ajouté, placé dans les 48 px ; les règles qui détachent l'en-tête (~l.7829-7845 : marge de 12 px, rayon et retrait propres), celles du module (.building-section-header ~l.6067 et ~l.6368-6395, globales hors media query) et les .panel-heading mobiles toujours battues de deferred-work.md (A12, `10px 15px`), si encore présentes, sont réécrites, pas battues ; le kramail prend cette carte par les mêmes règles communes et ne perd que ses déclarations contraires (titre en accent ~l.8958, retraits ~l.8952), sans règle propre, et la livre ainsi à l'épopée 7 ; cette règle de carte mobile est celle que reprennent les entrées 2 et 3 ; crée la suite cartes-pastilles.mjs et sa zone dans le routeur ; met à jour les suites qui figent ces en-têtes (fragments rayons et espacement de typographie-formes qui figent les panneaux de jeu et la réception mobile, masques du fragment regression de kramail-redaction), chaque masque avec sa condition de retrait."
verify = "Suite cartes-pastilles, fixtures jeu-materiel, jeu-perso, jeu-batiments, jeu-employes, jeu-plateau-objets et kramail-reception, à 375 et 767 px : en-tête de 48 px dans la même boîte arrondie à 8 px que le contenu, carte à 8 px des bords, titre 17 px 700 en couleur du texte ≥ 4,5:1 sur bg-surface dans les 16 variantes, repli qui plie et déplie au toucher de l'en-tête sur les panneaux gérés par le module ; à 768, 769 et 1280 px, en-têtes égaux à la base, transition 767 ↔ 768 dans le même onglet dans les deux sens ; npm run test:router vert."
