# tickets.toml — epic-kramail-mobile, dans l'ordre de construction.
# Inception complète le 2026-10-28 (autonome), après l'élargissement d'Arnaud du 2026-10-23 (même thème que le forum, ordinateur et mobile).
# Entrée 9 (hitl) après le sweep : le téléphone et les captures portent sur le code final ; elle tient lieu de vérification de clôture.
# Balle traçante : entrée 1 (gardes de page sur <html>, suite kramail-theme.mjs et sa zone, onglets de dossiers et boutons de 44 px sur mobile).
# Entrée la moins sûre ensuite : la lecture d'un message et d'un fil reprend le message de sujet V3 (Q22, aucune fixture de fil).
# Une seule lane : toutes les entrées touchent les sections kramail de kraland-theme.css (l.8842-11406), les modules Kramail:* du template et la suite kramail-theme.mjs ; chaînage par collision.
# Commun : P1 option 4 (réécrire l'origine, ne pas battre ; aucun nouvel !important ; gardes en :where(html.x)) ; mobile en max-width: 767px, ordinateur en min-width: 768px ;
# composants du forum repris tels que livrés par 5.1, 5.2, 6.3, 6.4, 6.5 et Messages:V3, sans changer le rendu du forum (sauf « Envoyer », entrée 7) ;
# couleurs par jetons de rôle de l'épopée 3, vérifiées dans les 16 variantes ; largeurs 375×667, 767, 768, 769, 1280, 1440 et 1920 px, Kraland clair et Empire Brun sombre au moins ;
# chaque plan consigne son rouge avant sur le bundle de sa base, puis une contre-épreuve (mutation → rouge) ; chaque masque porte sa condition de retrait ; chaque entrée qui touche tests/ lance npm run test:router ;
# fixtures synthétiques, aucune capture HTML brute dans le dépôt ; site réel en lecture seule, jamais /report, aucune action de jeu.

