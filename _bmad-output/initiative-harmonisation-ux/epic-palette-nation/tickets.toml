# tickets.toml — epic-palette-nation, dans l'ordre de construction.
# Balle traçante : entrée 1. Entrées chaînées : elles partagent la suite palette-nation.mjs (créée par l'entrée 1) et les blocs de variables du thème.
# Commun : valeurs de DESIGN.md › Colors (Rôles, Dériver une variante, Teintes du mode clair, Palette d'états, Jauges, Valeurs par variante) ;
# les valeurs marquées [ASSUMPTION] dans DESIGN.md (formules H5.2, états et jauges Q3, info en sombre Q4, anneau ≥ 3:1) sont reprises telles quelles,
# décision prise en autonomie et soumise à Arnaud (revue-manuelle.md) ; contrastes vérifiés dans les 16 variantes avec tests/e2e/lib/variantes.mjs
# (créé par le ticket 2.3) ; P1 option 4 ; vérifié à 375×667, 767, 768, 769, 1280, 1440, 1920 px ; pages de référence = zones du lot 3 (report,
# plateau, forum, croix), sur fixtures existantes ou créées par l'entrée qui en a besoin (aucune fixture d'accueil, d'Événements, de Contacts ni
# d'Interface n'existe).

