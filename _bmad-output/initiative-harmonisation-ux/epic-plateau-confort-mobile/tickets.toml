verify = "Suite confort-mobile, fixtures plateau-qualite-usage, jeu-plateau-objets, jeu-materiel, jeu-perso, jeu-batiments, jeu-employes et une fixture synthétique de l'Aide, à 320, 375×667, 700 et 767 px, Kraland clair et Empire Brun sombre : le premier pixel de chaque nœud texte visible est à ≥ 16 px des deux bords, cartes de section à 8 px ; à 768, 769 et 1280 px, rendu égal à la base ; bascule 767 ↔ 768 dans les deux sens ; npm run test:router vert."
covers = ["CAP-10"]
after = ["1.7"]
hitl = false
risk = "high"
