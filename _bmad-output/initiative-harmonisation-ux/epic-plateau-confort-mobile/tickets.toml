# tickets.toml — epic-plateau-confort-mobile, dans l'ordre de construction.
# Inception complète le 2026-10-28 (autonome) : entrées 1 à 12. Hypothèses et questions dans les Notes de epic-plateau-confort-mobile.md.
# Balle traçante : entrée 1 (marge de 16 px : applyMobileCriticalStyles du template, feuille, aide de mesure tests/e2e/lib/marges.mjs, suite confort-mobile.mjs et sa zone dans le routeur).
# L'entrée la moins sûre vient ensuite : entrée 2, carte de personnage selon sa propre largeur (H7.1, requête de conteneur, plage 1100-1500 px).
# Lanes : marge (1, 3, 4, 8, 9, 10) ; carte de personnage (2, 5, 7) ; démarrage mobile (6, indépendante). Les entrées 8, 9 et 10 mesurent la marge et les cibles
# dans la suite de leur page (forum-activite, suite du kramail, report-non-lu) avec l'aide de mesure de l'entrée 1, pour ne pas partager confort-mobile.mjs (décision prise en autonomie).
# Commun : valeurs de DESIGN.md › Layout & Spacing (marge mobile, hauteurs), Components (Carte de personnage, Croix directionnelle et pièces) et « Carte de personnage, détail » ;
# jetons --kr-margin-mobile (16 px), --kr-touch-target (44 px), --kr-touch-target-dpad (48 px), aujourd'hui inutilisés ou presque (rétro 4, A5) : chaque entrée consomme le jeton au lieu d'une valeur en dur ;
# une cible tactile se mesure par sa boîte (≥ 44×44, croix ≥ 48×48) ou par la ligne entière touchable (elementFromPoint au centre et aux bords), jamais par la seule hauteur ;
# la marge se mesure sur le texte : aucun nœud texte visible ne commence à moins de 16 px du bord de l'écran ; les cartes de section restent à 8 px des bords (H4.1), leur contenu à 16 px ;
# pièces du plateau dans l'ordre DOM natif, icônes remplacées avec repli sur l'URL d'origine ; mini-profil testé plié et déplié, à 375 et 700 px ;
# P1 option 4 : chaque entrée retire ou réécrit les règles qu'elle remplace, sans les battre par spécificité ou !important (aucun nouvel !important), et garde par page en :where(html.x) ce qu'elle conserve ;
# règle commune aux deux supports en liste combinée @media (max-width: 767px), (min-width: 768px) ; mobile en max-width: 767px seulement ; ordinateur en min-width: 768px seulement ;
# chaque plan consigne son rouge avant sur le bundle de sa base (KR_SCRIPT, classe kr-theme-enabled vérifiée), puis une contre-épreuve (mutation → rouge) ;
# aucun masque de test nouveau ; s'il en faut un, sa condition de retrait nomme un événement qui arrivera (rétro 5, F4 ; rétro 6, A2) ;
# boucle courte test:zone ou test:changed, un seul test:all à la fin sur machine calme et sur le SHA exact, ou le plan dit qu'il n'a pas été lancé (rétro 5, F2 et F11) ;
# une seule section Result par plan (rétro 6, A6) ; identifiants de report préfixés par l'épopée, D9.n (rétro 6, A7) ;
# toute règle de couleur vérifiée dans les 16 variantes ; largeurs : 320, 375×667, 700, 767, 768, 769, 1100, 1280, 1440, 1500 et 1920 px selon l'entrée, Kraland clair et Empire Brun sombre au moins ;
# transition 767 ↔ 768 dans le même onglet, dans les deux sens ; chaque entrée qui touche tests/ lance aussi npm run test:router ;
# site réel en lecture seule seulement (mandat d'Arnaud), jamais /report, aucune action de jeu ; fixtures synthétiques, aucune capture HTML brute dans le dépôt ;
# hors périmètre : boutons (épopée 4, sauf mesure), non-goals de la spec, index Staff (en attente d'Arnaud), correctif d'ancres mobile (D11, en attente d'Arnaud).

