[[entry]]
id = 2
type = "story"
title = "Modale d'ordre : fixture, suite et module actif sur les deux supports"
description = "Balle traçante. Fixture synthétique sur la structure relevée le 2026-10-22 (Dormir : avertissement avant les onglets ; Pouvoir : aide puis blocage dans l'onglet, libellé d'onglet en span.text-danger ; li.active ; ligne « Coût | Durée » en pied ; Cancel / OK), suite e2e réutilisant le harnais Bootbox de parler, zone enregistrée dans le routeur. Les fonctions de marquage, de repli de l'aide et de pastilles s'appliquent sur ordinateur et mobile, une seule fois même appelées deux fois, et se réappliquent quand le contenu de la modale est remplacé ; la grille d'onglets, le carrousel et le geste de balayage restent mobiles. Libellés « Annuler » / « Valider » pour les modales d'ordre seulement (H2.1)."
verify = "Suite modale-ordre : à 375 et 1280 px, Dormir et Pouvoir puis contenu remplacé : « Annuler » / « Valider », marquage présent une seule fois ; une confirmation hors ordre garde « Cancel » / « OK » ; npm run test:parler et npm run test:router verts."
covers = ["CAP-3"]
after = []
hitl = false
risk = "high"

