# tickets.toml — epic-typographie-formes, dans l'ordre de construction.
# Balle traçante : entrée 1 (jetons d'échelle déclarés, étiquettes et pastilles en 12 px gras sur le plateau, le forum et le kramail, suite typographie-formes.mjs et sa zone dans le routeur) ;
# elle ne passe pas par le template JS : les styles en ligne du template sont repris par les entrées 2 et 8.
# Entrées chaînées par collision, pas par dépendance fonctionnelle : elles partagent la suite typographie-formes.mjs (créée par l'entrée 1 ; palette-nation.mjs n'est pas allongée)
# et réécrivent les mêmes sections de kraland-theme.css ; les jetons --kr-font-*, --kr-radius-*, --kr-space-* déclarés par l'entrée 1 sont consommés par toutes (décision prise en autonomie, 2026-10-24).
# Commun : valeurs de DESIGN.md › Typography, Layout & Spacing, Shapes, Components ; tailles écrites en px (Bootstrap 3 fixe html à 10 px : 1 rem = 10 px) ;
# P1 option 4 : chaque entrée retire ou réécrit les règles qu'elle remplace, sans les battre par spécificité ou !important, et garde par page en :where(html.x) ce qu'elle conserve ;
# règle commune aux deux supports en liste combinée @media (max-width: 767px), (min-width: 768px) (note P1) ; mobile en max-width: 767px seulement ;
# chaque plan consigne son rouge avant sur le bundle de sa base, puis une contre-épreuve (mutation → rouge), et range son tri de revue sous ## Review Triage Log ;
# largeurs et variantes communes : 375×667, 767, 768, 769, 1280, 1440 et 1920 px, Kraland clair et Empire Brun sombre au moins ; fixtures synthétiques, existantes ou créées par l'entrée qui en a besoin ;
# chaque entrée qui touche tests/ lance aussi npm run test:router ;
# hors périmètre : focus clavier (ticket 3.7 abandonné, aucune règle :focus), couleurs (épopée 3), carte de section et familles de pastilles (épopée 5),
# cibles tactiles hors boutons et marge latérale de 16 px (épopée 9) ; boutons ≥ 44 px sur mobile gardés ; le kramail reçoit les règles communes sans entrée propre (épopée 7).

