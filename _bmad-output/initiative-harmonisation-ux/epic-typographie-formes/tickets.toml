description = "Balle traçante : jetons de taille de texte, de rayon et d'espacement de DESIGN.md déclarés sur :root (aucun n'existe aujourd'hui), consommés par les entrées suivantes et par l'épopée 8 ; toute étiquette et pastille (.label, .badge, « ici » de la croix à 10,5 px, « ! » de la cloche à 10 et 11 px, tags du forum à 8 et 9 px, .kr-topic-badge, badges du tableau de bord, puces du kramail) passe en 12 px gras par ces jetons, sans changer ses couleurs (H8.2) ; crée la suite typographie-formes.mjs et sa zone dans le routeur ; met à jour les suites qui figent ces tailles (modale-ordre pour les pastilles, forum-index, sous-forum, palette-nation)."
verify = "Suite typographie-formes : jetons calculés égaux à DESIGN.md ; sur les fixtures du plateau, du sous-forum, de l'index du forum et du kramail, aux largeurs et variantes communes, chaque étiquette et pastille visible est en 12 px et 700, couleurs égales à la base ; npm run test:router vert."
