# tickets.toml — epic-forum, dans l'ordre de construction.
# Inception partielle (décision d'Arnaud, 2026-10-22) : l'entrée 1 est avancée en tête de l'initiative et construite avant l'épopée 5 ;
# inception complète le 2026-10-25 (autonome) : entrées 2 à 7.
# Balle traçante : entrée 2 (index mobile dans la carte de section de 5.2, ligne ≥ 72 px, flèche et « premier non lu » qui mènent au message,
# suite forum-activite.mjs et sa zone dans le routeur) ; l'entrée 1 étant construite, l'épingle sur 5.2 porte sur l'entrée 2.
# L'entrée la moins sûre vient ensuite : un seul fil d'Ariane pour l'index, le sous-forum et le sujet (H12.3, trois implémentations à fusionner).
# Entrées chaînées par collision, pas par dépendance fonctionnelle : elles partagent la suite forum-activite.mjs (créée par l'entrée 2),
# la section « INDEX DU FORUM » de kraland-theme.css et les modules ForumHeader/ForumIndex/ForumThread du template (décision prise en autonomie, 2026-10-25).
# Commun : valeurs de DESIGN.md › Components (Ligne de forum, Fil d'Ariane, En-tête de sujet, Bouton « ••• », Carte de section) ; DESIGN et EXPERIENCE priment sur les maquettes ;
# P1 option 4 : chaque entrée retire ou réécrit les règles qu'elle remplace, sans les battre par spécificité ou !important (aucun nouvel !important), et garde par page en :where(html.x) ce qu'elle conserve ;
# règle commune aux deux supports en liste combinée @media (max-width: 767px), (min-width: 768px) ; mobile en max-width: 767px seulement ;
# chaque plan consigne son rouge avant sur le bundle de sa base (classe kr-theme-enabled vérifiée), puis une contre-épreuve (mutation → rouge), et range son tri de revue sous ## Review Triage Log ;
# chaque masque de test ajouté porte sa condition de retrait, qui nomme un événement qui arrivera (rétro de l'épopée 5, F4) ; toute règle de couleur est vérifiée dans les 16 variantes ;
# largeurs et variantes communes : 375×667, 767, 768, 769, 1280, 1440 et 1920 px, Kraland clair et Empire Brun sombre au moins ; transition 767 ↔ 768 dans le même onglet dans les deux sens ;
# fixtures synthétiques, existantes ou créées par l'entrée qui en a besoin ; aucune capture HTML brute dans le dépôt ; chaque entrée qui touche tests/ lance aussi npm run test:router ;
# hors périmètre : focus clavier (aucune règle :focus), ARIA, signal lu/non lu par forum, tri par activité (non-goals de la spec), thème du forum pour le kramail et barre d'envoi (épopée 7),
# marge latérale de 16 px et cibles hors forum (épopée 9), index Staff (exclu par 6.1, en attente d'Arnaud).

