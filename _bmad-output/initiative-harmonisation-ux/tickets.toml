# tickets.toml — épopées de l'initiative Harmonisation UX, dans l'ordre de construction.

[[epic]]
id = 1
slug = "epic-identite-et-defauts"
title = "Identité du personnage et pages sans décor emprunté"
covers = ["CAP-1", "CAP-2"]

[[epic]]
id = 2
slug = "epic-modale-ordre"
title = "Modale d'ordre lisible et sûre"
covers = ["CAP-3"]

[[epic]]
id = 3
slug = "epic-palette-nation"
title = "Couleurs de nation et contrastes"
covers = ["CAP-4"]
after = [{ epic = 1, needs = "décision P1 (stratégie de cascade)" }, { epic = 2, needs = "outil des 16 variantes et fixture de la modale d'ordre (ticket 2.3)" }]

[[epic]]
id = 4
slug = "epic-typographie-formes"
title = "Même rôle, même taille, même forme"
covers = ["CAP-5"]
after = [{ epic = 1, needs = "décision P1 (stratégie de cascade)" }, { epic = 2, needs = "section 9h de la modale d'ordre (tickets 2.6 et 2.7)" }, { epic = 3, needs = "jetons de couleur" }]

[[epic]]
id = 5
slug = "epic-cartes-pastilles"
