after = [{ epic = 1, needs = "décision P1 (stratégie de cascade)" }, { epic = 4, needs = "tailles de bouton" }, { epic = 6, needs = "pages du forum finies" }, { epic = 7, needs = "pages du kramail finies" }, { epic = 8, needs = "page des notifications finie" }]

[[epic]]
id = 10
slug = "epic-accueil-mobile"
