covers = ["CAP-6"]
after = [{ epic = 3, needs = "couleurs d'état et couleur « non lu »" }, { epic = 4, needs = "titres 17 px et rayons" }]

[[epic]]
id = 6
slug = "epic-forum"
title = "Forum : activité et repères"
covers = ["CAP-7"]
after = [{ epic = 5, needs = "carte de section du forum mobile (5.2)" }]

[[epic]]
id = 7
slug = "epic-kramail-mobile"
