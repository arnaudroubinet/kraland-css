after = [{ epic = 2, needs = "résultat P2 (vrai téléphone)" }, { epic = 3, needs = "jetons de rôle (3.1)" }, { epic = 5, needs = "carte de section (5.1) et liste des sujets (5.2)" }, { epic = 6, needs = "« ••• » commun (6.5), fil d'Ariane et en-tête de sujet (6.3, 6.4)" }]

[[epic]]
id = 8
slug = "epic-notifications"
