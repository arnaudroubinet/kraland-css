# tickets.toml — epic-accueil-mobile, dans l'ordre de construction.
# Inception complète le 2026-10-29 (autonome) : entrées 1 à 4, découpe donnée par la demande. Hypothèses et questions dans les Notes de epic-accueil-mobile.md.
# Une seule lane (1, 2, 3, 4), aucune entrée parallèle : chacune a besoin du résultat de la précédente.
# Balle traçante : entrée 2 (fixture réaliste, suite accueil-mobile.mjs et sa zone dans le routeur, mesurée avec tests/e2e/lib/marges.mjs), précédée du spike 1 (Decision dans les Notes) ; l'entrée la moins sûre est la 3 (refonte).
# Commun : valeurs de DESIGN.md › Layout & Spacing (marge mobile, cartes de section, hauteurs), Typography et Components › Carte de section ;
# jetons --kr-margin-mobile (16 px), --kr-touch-target (44 px) : consommés, jamais une valeur en dur ;
# une cible tactile se mesure par sa boîte (≥ 44×44) ou par la ligne entière touchable (elementFromPoint au centre et aux bords), jamais par la seule hauteur ;
# la marge se mesure sur le texte : aucun nœud texte visible ne commence à moins de 16 px du bord ; cartes de section à 8 px des bords, contenu à 16 px ;
# P1 option 4 : retirer ou réécrire les règles .page-accueil remplacées, sans les battre par spécificité ni !important (aucun nouvel !important), garder par page en :where(html.kr-page-accueil) ;
# mobile en max-width: 767px seulement, ordinateur en min-width: 768px seulement ; règle commune en liste combinée ;
# chaque plan consigne son rouge avant sur le bundle de sa base (KR_SCRIPT, classe kr-theme-enabled vérifiée), puis une contre-épreuve (mutation → rouge) ;
# aucun masque de test nouveau ; boucle courte test:zone ou test:changed, un seul test:all à la fin sur machine calme et sur le SHA exact ; toute entrée qui touche tests/ lance npm run test:router ;
# largeurs : 320, 375×667, 700, 767, 768, 769, 1280, 1440 et 1920 px, Kraland clair et Empire Brun sombre au moins ; règle de couleur vérifiée dans les 16 variantes ;
# site réel en lecture seule seulement (mandat d'Arnaud) : aucune action de jeu, aucun clic sur la cloche, jamais de préchargement de /report ;
# aucun HTML brut ni capture dans le dépôt, captures dans /Users/arnaud/kraland-css-captures/<ticket>/ ; données de jeu non anonymisées ;
# identifiants de report préfixés par l'épopée, D10.n ; une seule section Result par plan.

