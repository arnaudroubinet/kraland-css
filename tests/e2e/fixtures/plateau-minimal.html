<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture plateau (structure minimale, sans données réelles)</title>
  <style>
    /* Extrait de Bootstrap 3 (jauges seulement) : la fixture ne charge pas la feuille du site */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    .progress { height: 20px; margin-bottom: 20px; overflow: hidden; background-color: #f5f5f5; border-radius: 4px; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .1); }
    .progress-bar { float: left; width: 0; height: 100%; font-size: 12px; line-height: 20px; color: #fff; text-align: center; background-color: #337ab7; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .15); }
    .progress-bar-success { background-color: #5cb85c; }
    .progress-bar-warning { background-color: #f0ad4e; }
  </style>
</head>
<body>
  <nav class="navbar navbar-inverse nomargin">
    <div class="container">
      <div class="navbar-header">
        <button class="navbar-toggle collapsed" type="button"><span class="icon-bar"></span><span class="icon-bar"></span><span class="icon-bar"></span></button>
        <a class="navbar-brand" href="/">Kraland</a>
      </div>
      <div id="navbar" class="navbar-collapse collapse">
        <ul class="nav navbar-nav">
          <li class="dropdown"><a class="dropdown-toggle" href="/jouer/plateau">Jouer</a></li>
          <li class="dropdown"><a class="dropdown-toggle" href="/regles">Règles</a></li>
        </ul>
        <ul class="nav navbar-nav navbar-right">
          <li><a href="/kramail">Kramail</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div id="content" class="container">
    <div class="row">
      <div id="col-leftest" class="col-md-1">
        <div id="col-leftest-stats" class="panel panel-body"><div class="btn-group-xs"><a class="btn btn-default mini" href="#">3</a></div></div>
      </div>
      <div id="col-left" class="col-md-3 sidebar">
        <div id="player-header-section" class="list-group">
          <span class="list-group-item active">Joueur</span>
          <div id="player-main-panel" class="panel panel-body">
            <textarea id="champ-saisie" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <!-- Jauges : structure native relevée sur le site réel (segment success = valeur, warning = reste).
             Valeurs : PM 25/25 (réel), PP 0 avec reste 150 (réel) ; PV 20 avec reste 7 est SYNTHÉTIQUE
             (valeur intermédiaire jamais observée sur le site réel). -->
        <div class="t row">
          <div class="col-xs-12">
            <a class="btn btn-default alert141 mini" href="#">PV&nbsp; 20</a>
            <div class="progress" style="height:10px;margin-top:5px">
              <div class="progress-bar progress-bar-success" style="width: 74.074%"><span class="sr-only">20</span></div>
              <div class="progress-bar progress-bar-warning" style="width: 25.926%"><span class="sr-only">7</span></div>
            </div>
            <a class="btn btn-default alert142 mini" href="#">PM&nbsp; 25</a>
            <div class="progress" style="height:10px;margin-top:5px">
              <div class="progress-bar progress-bar-success" style="width: 100%"><span class="sr-only">25</span></div>
              <div class="progress-bar progress-bar-warning" style="width: 0%"><span class="sr-only">0</span></div>
            </div>
            <a class="btn btn-default alert143 mini" href="#">PP&nbsp; 0</a>
            <div class="progress" style="height:10px;margin-top:5px">
              <div class="progress-bar progress-bar-success" style="width: 0%"><span class="sr-only">0</span></div>
              <div class="progress-bar progress-bar-warning" style="width: 100%"><span class="sr-only">150</span></div>
            </div>
          </div>
        </div>
      </div>
      <div id="col-right" class="col-md-8">
        <div class="container-fluid">
          <div class="row t" style="height: 4000px">Contenu long pour tester le défilement</div>
        </div>
      </div>
    </div>
  </div>
  <footer><div class="container white"><a href="#top" class="well well-sm"><i class="glyphicon glyphicon-chevron-up"></i></a></div></footer>
</body>
</html>
