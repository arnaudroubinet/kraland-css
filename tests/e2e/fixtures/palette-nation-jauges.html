<!DOCTYPE html>

<head>

  <title>Fixture plateau — jauges PV, PM et PP du panneau (synthétique, sans données réelles)</title>
  <!-- FIXTURE SYNTHÉTIQUE de la suite palette-nation (épopée 3, ticket 6) : plateau-qualite-usage.html et, à la place de sa ligne « 1 PV »,

       bouton .btn-group-xs (alert141 PV, alert142 PM, alert143 PP) puis une .progress à deux segments, .progress-bar-success (valeur) et
       .progress-bar-warning (reste), largeurs en ligne ; PM et PP partagent la seconde .row. Rien n'est cliqué ni envoyé. -->

  <link rel="stylesheet" href="lib/bootstrap-3.3.7/css/bootstrap1.min.css">

  </style>
</head>
<body>

<a class="btn btn-primary alert11 mini" href="#" data-toggle="tooltip" data-placement="bottom" title="" data-original-title="Dormir"><i class="fa fa-bed"></i> Dormir</a>

      </div>
    </div>
  </div>
  <footer><div class="container white"><a href="#top" class="well well-sm">Haut</a></div></footer>
  <script>
    // Gestionnaires natifs du site (simulés) : doivent survivre au déplacement des boutons dans la grille.
    window.__clicks = {};
    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href="#"]') : null;
      if (!a) { return; }
      e.preventDefault();
      var k = Array.from(a.classList).find(function (c) { return /^alert/.test(c); }) || 'autre';
      window.__clicks[k] = (window.__clicks[k] || 0) + 1;
    });
  </script>
  <script src="lib/jquery-3.3.1/jquery-3.3.1.min.js"></script>
  <script src="lib/bootstrap-3.3.7/js/bootstrap.min.js"></script>
